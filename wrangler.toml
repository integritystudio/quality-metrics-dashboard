name = "obs-toolkit-quality-metrics-api"
main = "worker/index.ts"
compatibility_date = "2025-01-01"
account_id = "b3868dd0fd5c0faa7d98aa325a9c2377"

# Do not remove. Default is ON, which publishes every *retained* version at
# <8-hex-version-prefix>-<script>.<subdomain>.workers.dev. A version is an immutable
# snapshot of code AND bindings, so each old preview keeps serving the
# SUPABASE_SERVICE_ROLE_KEY it was uploaded with — a rotation never reaches backwards.
# Measured 2026-08-06 before this line: 4 of 4 probed versions live on both Workers.
# Independent of workers_dev (main URL and routes unaffected); inheritable by named envs.
preview_urls = false

[observability]
enabled = true

[vars]
AUTH0_DOMAIN = "dev-68gg87ow4mg4kzyo.us.auth0.com"
AUTH0_AUDIENCE = "https://api.integritystudio.dev"
# Org-scoped multi-tenancy (docs/roadmap in parent repo: org-scoped-multi-tenancy.md).
# HOME_ORG_ID: org owning all pre-multi-tenancy data. STAFF_USER_IDS: explicit
# cross-org superuser allowlist (owner-approved 2026-07-18); JSON array of user UUIDs.
# Consumed from P5 (worker org resolution) onward; inert until then.
HOME_ORG_ID = "f4286657-da73-4174-9e49-937f1bb6097f"
STAFF_USER_IDS = '["f7a787eb-b97f-4636-b68d-2a08c52ae13d","b178a643-7bde-44d9-b533-fd9c827786b3","f5e6d6e0-f618-46bb-9b17-477f0016148e","cc43086f-708f-467c-9483-666b1e294832","ed37810d-0792-47c6-9108-a3a1f62a8eaa","adff602e-1ac6-4f86-9ee3-2e880123f6dd","f78fdf56-6a7a-461b-8cfc-c80d1746d693","a752e2c0-136f-4dd7-b973-616d49053338","ce183805-4b76-454a-b198-7e12dbcd86c9","39557dad-3019-4fd1-a38d-4c99afa8307f"]'

[[kv_namespaces]]
binding = "DASHBOARD"
id = "902fc8a43e7147b486b6376c485c4506"
preview_id = "0f4d40dd84b14e038024a9775b9be4f7"

[assets]
directory = "./dist"
binding = "ASSETS"

# ---------------------------------------------------------------------------
# Dev environment — `quality-metrics-api-dev`
#
# THE reason this block has to exist: AUTH0_DOMAIN is a plaintext var, so it does
# NOT follow `--config dev`. Before this, Doppler dev's DEV_WORKER_URL pointed at
# the PRODUCTION worker, which verifies JWTs against the PRODUCTION Auth0 tenant
# (dev-68gg87ow4mg4kzyo) — while the e2e suite mints its test user through
# sender-worker-dev against the DEV tenant (dev-njjmghdzm23uy0p7). A dev-tenant
# JWT met a production-tenant JWKS and 401'd before reaching the role check, so
# the two tests expecting 403 received 401 and read as a permissions bug.
# Measured, not inferred: the signup JWT carries
# iss=https://dev-njjmghdzm23uy0p7.us.auth0.com/ and aud=https://api.integritystudio.dev.
#
# A named environment REPLACES the parent block rather than merging with it, so
# every non-inheritable key below is repeated deliberately.
[env.dev]
name = "quality-metrics-api-dev"

[env.dev.vars]
# The dev Auth0 tenant. This one line is the fix.
AUTH0_DOMAIN = "dev-njjmghdzm23uy0p7.us.auth0.com"
# Identical string in both tenants by design — an Auth0 API identifier is just a
# name, and each tenant registers its own API under it. The audience was never
# the mismatch; only the issuer/JWKS was.
AUTH0_AUDIENCE = "https://api.integritystudio.dev"
# Deliberately empty, not copied. Both hold PRODUCTION identifiers — an org uuid
# and ten staff user uuids that exist only in project cfrbahzzklwrnmbtqojl. Dev
# has no equivalent rows, and carrying production uuids into a dev Worker is the
# exact shape of the `createTestUser` hardcoded-prod-org defect. Nothing reads
# either var yet (P5 org resolution is unbuilt); when P5 lands, an empty value
# must fail loudly in dev rather than silently resolve a production org.
HOME_ORG_ID = ""
STAFF_USER_IDS = "[]"

[env.dev.observability]
enabled = true

# Its OWN namespace, not production's `902fc8a4…`. The Worker only ever reads KV
# (no `.put` anywhere in worker/index.ts), so sharing would not corrupt anything —
# it would just mean a dev Worker serving production telemetry, which is the thing
# this whole environment split exists to prevent. Seeded by
# `services/e2e/scripts/seed-dev.ts`; without a `dashboard:7d` key `/api/dashboard`
# answers 404 by design (ERR_NO_DATA), so the seed is a test prerequisite.
# No `preview_id`: `wrangler dev` is not used against this environment.
[[env.dev.kv_namespaces]]
binding = "DASHBOARD"
id = "fc5bbe4889a645a4b7744ce236b563be"

# Repeated because `assets` is not inherited into a named environment, and the
# ASSETS binding is what the SPA fallback route calls.
[env.dev.assets]
directory = "./dist"
binding = "ASSETS"

# NOTE: ALLOW_TEST_BYPASS is absent here on purpose. The dev Worker authenticates
# real dev-tenant JWTs; a bypass would make every dashboard-auth assertion vacuous.

# The worker imports a dashboard-schemas module that re-exports from @parent
# (the parent observability-toolkit dist/). CI builds the dashboard standalone
# without the parent package, so redirect @parent/ lookups to a local stub.
# The worker does not consume any @parent exports at runtime.
[alias]
"@parent/lib/core/shared-schemas.js" = "./worker/parent-stub.ts"
"@parent/lib/validation/dashboard-schemas.js" = "./worker/parent-stub.ts"
