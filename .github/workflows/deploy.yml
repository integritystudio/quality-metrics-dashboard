name: Deploy Workers

# integritystudio.dev is a Workers custom domain on quality-metrics-api
# (migrated off GitHub Pages 2026-08-22). The SPA is served by the Workers
# asset layer and always calls /api on its own origin.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4
      - run: npm ci
      # Production deps only: the Worker ships the Vite bundle and its runtime
      # imports, never devDependencies, and braces (GHSA-vfj7-8cjw-p6xm, via
      # repomix) has no patched release. Same gate in ci.yml and deploy.yml.
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev
      # Several src tests import the parent observability-toolkit through `@parent/*`
      # (tsconfig: `../dist/*`), which a standalone checkout does not have. Without it
      # 72 of the src tests fail and deploy-worker never runs: every push from
      # 2026-09-28 to 09-30 failed here. The same step as ci.yml; keep the two in step.
      - name: Build parent observability-toolkit into ../dist
        run: |
          GH_TOKEN=$(doppler secrets get GITHUB_TOKEN --project integrity-studio --config prd --plain)
          echo "::add-mask::$GH_TOKEN"
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/integritystudio/observability-toolkit.git" \
            "${RUNNER_TEMP}/parent"
          npm ci --prefix "${RUNNER_TEMP}/parent"
          npm run build --prefix "${RUNNER_TEMP}/parent"
          # tsconfig resolves @parent/* to ../dist/* relative to this checkout.
          # Symlink rather than copy: the parent's compiled output requires its
          # own runtime deps (zod and friends), which Node finds by walking up
          # from the module's REAL path. A copied dist/ has no node_modules
          # beside it and dies with "Cannot find module 'zod'"; a symlink
          # resolves back into the parent checkout, exactly as on a dev machine
          # where ../dist sits inside the parent repo.
          ln -s "${RUNNER_TEMP}/parent/dist" "${GITHUB_WORKSPACE}/../dist"
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Run src tests
        run: npm test src/

  deploy-worker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4
      - run: npm ci
      - name: Build with env vars from Doppler (same-origin API)
        run: |
          export VITE_AUTH0_DOMAIN=$(doppler secrets get VITE_AUTH0_DOMAIN --project integrity-studio --config prd --plain)
          export VITE_AUTH0_CLIENT_ID=$(doppler secrets get VITE_AUTH0_CLIENT_ID --project integrity-studio --config prd --plain)
          export VITE_AUTH0_AUDIENCE=$(doppler secrets get VITE_AUTH0_AUDIENCE --project integrity-studio --config prd --plain)
          # api-gateway, which the admin customer view reads cross-origin (not a worker URL:
          # the SPA's own /api stays same-origin). Doppler prd holds the production gateway.
          export VITE_API_GATEWAY_URL=$(doppler secrets get VITE_API_GATEWAY_URL --project integrity-studio --config prd --plain)
          # Supabase, read directly from the browser with the Auth0 ID token (CR62). The anon
          # key is the publishable one; RLS decides what the token sees. Leave either unset and
          # the SPA simply makes no such read.
          export VITE_SUPABASE_URL=$(doppler secrets get VITE_SUPABASE_URL --project integrity-studio --config prd --plain)
          export VITE_SUPABASE_ANON_KEY=$(doppler secrets get VITE_SUPABASE_ANON_KEY --project integrity-studio --config prd --plain)
          npm run build
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Deploy default worker
        run: CLOUDFLARE_API_TOKEN=$(doppler secrets get CLOUDFLARE_WORKER_TOKEN --project integrity-studio --config prd --plain) npx wrangler deploy
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Deploy production worker
        run: CLOUDFLARE_API_TOKEN=$(doppler secrets get CLOUDFLARE_WORKER_TOKEN --project integrity-studio --config prd --plain) npx wrangler deploy --name quality-metrics-api
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
