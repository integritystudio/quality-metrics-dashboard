name: Deploy Workers

# integritystudio.dev is a Workers custom domain on quality-metrics-api
# (migrated off GitHub Pages 2026-08-22). The SPA is served by the Workers
# asset layer, so the build uses a same-origin API base: VITE_API_URL is
# deliberately NOT exported here — resolveApiBase falls back to '' in prod
# builds, and the worker serves /api/* on the same origin.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run src tests (script tests require parent dist from observability-toolkit)
        run: npm test src/

  deploy-worker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3
      - run: npm ci
      - name: Build with env vars from Doppler (same-origin API — no VITE_API_URL)
        run: |
          export VITE_AUTH0_DOMAIN=$(doppler secrets get VITE_AUTH0_DOMAIN --project integrity-studio --config prd --plain)
          export VITE_AUTH0_CLIENT_ID=$(doppler secrets get VITE_AUTH0_CLIENT_ID --project integrity-studio --config prd --plain)
          export VITE_AUTH0_AUDIENCE=$(doppler secrets get VITE_AUTH0_AUDIENCE --project integrity-studio --config prd --plain)
          npm run build
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Deploy default worker
        run: CLOUDFLARE_API_TOKEN=$(doppler secrets get CLOUDFLARE_WORKER_TOKEN --project integrity-studio --config prd --plain) npx wrangler deploy
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Deploy production worker
        run: CLOUDFLARE_API_TOKEN=$(doppler secrets get CLOUDFLARE_WORKER_TOKEN --project integrity-studio --config prd --plain) npx wrangler deploy --name quality-metrics-api
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
