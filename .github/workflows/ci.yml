name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # cli-action only installs the CLI — it has no `token` input, so the
      # token must reach `doppler run` as an env var on the step itself
      # (same pattern as deploy.yml).
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Run src tests (script tests require parent dist from observability-toolkit)
        run: doppler run --project integrity-studio --config prd -- npm test src/
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Run E2E tests
        run: npm run test:e2e
